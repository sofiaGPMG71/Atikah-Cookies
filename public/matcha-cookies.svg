<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8f9f5"/>
      <stop offset="100%" stop-color="#e2e8dc"/>
    </radialGradient>

    <!-- Cookie Base Texture Gradient -->
    <radialGradient id="cookieGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a4c664"/>
      <stop offset="50%" stop-color="#80a842"/>
      <stop offset="85%" stop-color="#60822c"/>
      <stop offset="100%" stop-color="#4a681e"/>
    </radialGradient>

    <!-- Cookie 2 Gradient -->
    <radialGradient id="cookieGrad2" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#b0d26e"/>
      <stop offset="60%" stop-color="#83aa42"/>
      <stop offset="100%" stop-color="#557523"/>
    </radialGradient>

    <!-- Chocolate Chip Gradient -->
    <radialGradient id="chocoGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#694125"/>
      <stop offset="40%" stop-color="#3d2210"/>
      <stop offset="100%" stop-color="#1f0f06"/>
    </radialGradient>

    <!-- White Chocolate Chunk Gradient -->
    <radialGradient id="whiteChocoGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5efe0"/>
      <stop offset="100%" stop-color="#dbcfb4"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2d3d18" flood-opacity="0.25"/>
    </filter>

    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Scattered Sea Salt Flakes & Powder in BG -->
  <g opacity="0.6">
    <ellipse cx="120" cy="180" rx="4" ry="2" fill="#80a842" transform="rotate(25 120 180)"/>
    <ellipse cx="680" cy="220" rx="5" ry="3" fill="#80a842" transform="rotate(-15 680 220)"/>
    <polygon points="150,120 156,124 152,130 146,126" fill="#ffffff" opacity="0.9"/>
    <polygon points="650,680 658,683 654,691 647,686" fill="#ffffff" opacity="0.9"/>
    <circle cx="220" cy="710" r="3" fill="#3d2210"/>
    <circle cx="720" cy="450" r="4" fill="#3d2210"/>
  </g>

  <!-- Top-Left Partial Cookie -->
  <g filter="url(#shadow)" transform="translate(-80, -60)">
    <path d="M 120,280 C 140,150 280,100 420,130 C 520,150 560,260 520,380 C 470,480 320,520 200,480 C 110,450 100,360 120,280 Z" fill="url(#cookieGrad)"/>
    <!-- Surface crinkles -->
    <path d="M 220,180 Q 280,195 340,170" stroke="#5d8024" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 180,260 Q 260,280 380,240" stroke="#5d8024" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- Dark Choco Chips -->
    <ellipse cx="280" cy="220" rx="22" ry="18" fill="url(#chocoGrad)" filter="url(#chipShadow)" transform="rotate(15 280 220)"/>
    <ellipse cx="380" cy="290" rx="25" ry="20" fill="url(#chocoGrad)" filter="url(#chipShadow)" transform="rotate(-20 380 290)"/>
    <ellipse cx="210" cy="340" rx="20" ry="16" fill="url(#chocoGrad)" filter="url(#chipShadow)"/>
    <!-- Sea Salt -->
    <polygon points="310,210 320,214 315,224 305,218" fill="#ffffff"/>
    <polygon points="250,290 258,293 254,301 247,296" fill="#ffffff"/>
  </g>

  <!-- Main Center Zenith Matcha Cookie -->
  <g filter="url(#shadow)">
    <!-- Base Cookie Contour -->
    <path d="M 400,220 C 580,210 680,310 670,480 C 660,640 520,710 370,690 C 220,670 140,540 160,380 C 180,240 280,225 400,220 Z" fill="url(#cookieGrad2)"/>
    
    <!-- Organic Edge & Surface Texture Crinkles -->
    <path d="M 280,320 Q 400,280 540,330" stroke="#4d6d1d" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 230,420 Q 380,450 580,400" stroke="#4d6d1d" stroke-width="8" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M 260,540 Q 420,580 550,520" stroke="#4d6d1d" stroke-width="7" fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- Large Chocolate Chips embedded (Matching User Photo style!) -->
    <g filter="url(#chipShadow)">
      <!-- Top Right Chip -->
      <path d="M 500,320 C 520,300 550,310 560,335 C 570,360 540,380 515,370 C 495,360 490,335 500,320 Z" fill="url(#chocoGrad)"/>
      <ellipse cx="530" cy="335" rx="6" ry="3" fill="#8d5b38" opacity="0.7"/>

      <!-- Center Large Chip -->
      <path d="M 380,420 C 410,400 450,415 455,445 C 460,475 425,500 390,490 C 365,480 360,440 380,420 Z" fill="url(#chocoGrad)"/>
      <ellipse cx="410" cy="440" rx="8" ry="4" fill="#8d5b38" opacity="0.7"/>

      <!-- Bottom Right Chip -->
      <path d="M 490,560 C 515,540 545,555 550,580 C 555,605 525,625 498,615 C 475,605 475,575 490,560 Z" fill="url(#chocoGrad)"/>

      <!-- Left Chip -->
      <path d="M 250,450 C 275,435 300,450 305,475 C 310,495 285,515 260,505 C 240,495 235,465 250,450 Z" fill="url(#chocoGrad)"/>

      <!-- Top Left White Choco Chunk -->
      <path d="M 310,310 C 330,295 355,305 360,325 C 365,345 340,360 320,355 C 300,350 298,325 310,310 Z" fill="url(#whiteChocoGrad)"/>

      <!-- Bottom Center White Choco Chunk -->
      <path d="M 340,580 C 360,565 385,575 390,595 C 395,615 370,630 350,625 C 330,620 328,595 340,580 Z" fill="url(#whiteChocoGrad)"/>
    </g>

    <!-- Coarse Sea Salt Flakes (Bright white crystals like in user photo) -->
    <g fill="#ffffff" opacity="0.95">
      <!-- Flake 1 -->
      <polygon points="420,360 432,364 426,376 414,370"/>
      <!-- Flake 2 -->
      <polygon points="320,440 330,443 325,452 315,448"/>
      <!-- Flake 3 -->
      <polygon points="470,470 482,473 477,483 465,478"/>
      <!-- Flake 4 -->
      <polygon points="380,510 390,513 385,522 375,518"/>
      <!-- Flake 5 -->
      <polygon points="530,490 540,493 536,501 526,497"/>
      <!-- Small salt specks -->
      <rect x="290" y="380" width="4" height="4" transform="rotate(15 290 380)"/>
      <rect x="450" y="390" width="5" height="5" transform="rotate(35 450 390)"/>
      <rect x="420" y="550" width="4" height="4" transform="rotate(20 420 550)"/>
    </g>
  </g>

  <!-- Top Right Partial Cookie -->
  <g filter="url(#shadow)" transform="translate(480, -100)">
    <path d="M 120,280 C 200,150 340,120 440,200 C 520,280 500,420 420,480 C 320,540 180,480 120,380 Z" fill="url(#cookieGrad)"/>
    <ellipse cx="280" cy="300" rx="24" ry="19" fill="url(#chocoGrad)" filter="url(#chipShadow)"/>
    <polygon points="270,290 280,293 275,302 265,298" fill="#ffffff"/>
  </g>

  <!-- Bottom Right Partial Cookie -->
  <g filter="url(#shadow)" transform="translate(450, 420)">
    <path d="M 150,220 C 280,180 400,240 420,380 C 430,500 320,600 180,580 C 80,550 90,320 150,220 Z" fill="url(#cookieGrad2)"/>
    <ellipse cx="260" cy="320" rx="26" ry="20" fill="url(#chocoGrad)" filter="url(#chipShadow)"/>
    <polygon points="250,310 260,313 255,322 245,318" fill="#ffffff"/>
  </g>
</svg>
