<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f5f0"/>
    </linearGradient>

    <!-- Cookie Base Texture Gradient -->
    <linearGradient id="cookieGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf83"/>
      <stop offset="40%" stop-color="#d49e59"/>
      <stop offset="80%" stop-color="#b57a38"/>
      <stop offset="100%" stop-color="#8f5722"/>
    </linearGradient>

    <linearGradient id="cookieGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edd19a"/>
      <stop offset="50%" stop-color="#cd9550"/>
      <stop offset="100%" stop-color="#9a622a"/>
    </linearGradient>

    <!-- Raisin/Cranberry Gradient -->
    <radialGradient id="raisinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7a2228"/>
      <stop offset="40%" stop-color="#451216"/>
      <stop offset="85%" stop-color="#24070a"/>
      <stop offset="100%" stop-color="#120204"/>
    </radialGradient>

    <radialGradient id="cranberryGrad" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ba2b3b"/>
      <stop offset="50%" stop-color="#801421"/>
      <stop offset="100%" stop-color="#3b050c"/>
    </radialGradient>

    <!-- Rolled Oat Flake Color -->
    <linearGradient id="oatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2db"/>
      <stop offset="100%" stop-color="#e3c291"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="stackShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#54381e" flood-opacity="0.18"/>
    </filter>

    <filter id="layerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3d230d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- Main Cookie Stack Group -->
  <g filter="url(#stackShadow)">

    <!-- Bottom Shadow on Ground -->
    <ellipse cx="400" cy="800" rx="200" ry="24" fill="#3d230d" opacity="0.25"/>

    <!-- COOKIE 6 (Bottom Base) -->
    <g filter="url(#layerShadow)" transform="translate(0, 50)">
      <path d="M 220,700 C 250,670 380,665 580,685 C 620,710 600,750 550,765 C 450,780 300,775 220,750 C 190,730 195,710 220,700 Z" fill="url(#cookieGrad1)"/>
      <!-- Oats & Texture -->
      <ellipse cx="320" cy="720" rx="14" ry="6" fill="url(#oatGrad)" transform="rotate(-15 320 720)"/>
      <ellipse cx="450" cy="735" rx="16" ry="7" fill="url(#oatGrad)" transform="rotate(20 450 735)"/>
      <ellipse cx="280" cy="740" rx="12" ry="5" fill="url(#oatGrad)" transform="rotate(5 280 740)"/>
      <!-- Raisins -->
      <ellipse cx="380" cy="730" rx="16" ry="11" fill="url(#raisinGrad)"/>
      <ellipse cx="500" cy="725" rx="14" ry="10" fill="url(#cranberryGrad)"/>
    </g>

    <!-- COOKIE 5 -->
    <g filter="url(#layerShadow)" transform="translate(0, 10)">
      <path d="M 210,630 C 260,600 420,595 590,620 C 620,645 590,685 540,700 C 420,715 280,710 210,680 C 180,660 185,640 210,630 Z" fill="url(#cookieGrad2)"/>
      <!-- Oats -->
      <ellipse cx="290" cy="640" rx="15" ry="7" fill="url(#oatGrad)" transform="rotate(10 290 640)"/>
      <ellipse cx="420" cy="660" rx="18" ry="8" fill="url(#oatGrad)" transform="rotate(-25 420 660)"/>
      <ellipse cx="510" cy="645" rx="13" ry="6" fill="url(#oatGrad)" transform="rotate(15 510 645)"/>
      <!-- Raisins & Cranberries -->
      <ellipse cx="340" cy="655" rx="18" ry="12" fill="url(#cranberryGrad)"/>
      <ellipse cx="470" cy="650" rx="15" ry="11" fill="url(#raisinGrad)"/>
      <ellipse cx="240" cy="660" rx="14" ry="9" fill="url(#raisinGrad)"/>
    </g>

    <!-- COOKIE 4 -->
    <g filter="url(#layerShadow)" transform="translate(0, -30)">
      <path d="M 230,550 C 280,520 440,515 580,540 C 610,565 580,605 530,620 C 410,635 270,630 210,600 C 190,580 200,560 230,550 Z" fill="url(#cookieGrad1)"/>
      <!-- Oats -->
      <ellipse cx="310" cy="565" rx="16" ry="7" fill="url(#oatGrad)" transform="rotate(-18 310 565)"/>
      <ellipse cx="460" cy="580" rx="15" ry="7" fill="url(#oatGrad)" transform="rotate(12 460 580)"/>
      <ellipse cx="370" cy="590" rx="14" ry="6" fill="url(#oatGrad)" transform="rotate(5 370 590)"/>
      <!-- Raisins -->
      <ellipse cx="280" cy="580" rx="17" ry="11" fill="url(#raisinGrad)"/>
      <ellipse cx="410" cy="570" rx="19" ry="13" fill="url(#cranberryGrad)"/>
      <ellipse cx="520" cy="565" rx="15" ry="10" fill="url(#raisinGrad)"/>
    </g>

    <!-- COOKIE 3 -->
    <g filter="url(#layerShadow)" transform="translate(0, -70)">
      <path d="M 220,470 C 270,440 430,435 570,460 C 600,485 570,525 520,540 C 400,555 270,550 200,520 C 180,500 190,480 220,470 Z" fill="url(#cookieGrad2)"/>
      <!-- Oats -->
      <ellipse cx="300" cy="480" rx="17" ry="8" fill="url(#oatGrad)" transform="rotate(15 300 480)"/>
      <ellipse cx="440" cy="500" rx="16" ry="7" fill="url(#oatGrad)" transform="rotate(-10 440 500)"/>
      <ellipse cx="500" cy="485" rx="14" ry="6" fill="url(#oatGrad)" transform="rotate(22 500 485)"/>
      <!-- Raisins & Cranberries -->
      <ellipse cx="360" cy="495" rx="18" ry="12" fill="url(#raisinGrad)"/>
      <ellipse cx="250" cy="490" rx="16" ry="11" fill="url(#cranberryGrad)"/>
      <ellipse cx="480" cy="500" rx="15" ry="10" fill="url(#raisinGrad)"/>
    </g>

    <!-- COOKIE 2 -->
    <g filter="url(#layerShadow)" transform="translate(0, -110)">
      <path d="M 225,390 C 275,360 435,355 575,380 C 605,405 575,445 525,460 C 405,475 275,470 205,440 C 185,420 195,400 225,390 Z" fill="url(#cookieGrad1)"/>
      <!-- Oats -->
      <ellipse cx="290" cy="405" rx="16" ry="7" fill="url(#oatGrad)" transform="rotate(-12 290 405)"/>
      <ellipse cx="420" cy="420" rx="18" ry="8" fill="url(#oatGrad)" transform="rotate(18 420 420)"/>
      <ellipse cx="510" cy="405" rx="13" ry="6" fill="url(#oatGrad)" transform="rotate(-5 510 405)"/>
      <!-- Raisins -->
      <ellipse cx="350" cy="415" rx="19" ry="12" fill="url(#cranberryGrad)"/>
      <ellipse cx="460" cy="425" rx="16" ry="11" fill="url(#raisinGrad)"/>
      <ellipse cx="240" cy="410" rx="14" ry="9" fill="url(#raisinGrad)"/>
    </g>

    <!-- COOKIE 1 (Top Hero Cookie) -->
    <g filter="url(#layerShadow)" transform="translate(0, -150)">
      <!-- Irregular Rustic Top Cookie Body -->
      <path d="M 215,290 C 265,245 425,240 565,270 C 605,300 585,350 525,375 C 415,395 265,390 195,355 C 175,330 185,305 215,290 Z" fill="url(#cookieGrad2)"/>
      
      <!-- Crinkles and Oatmeal texture lines -->
      <path d="M 260,295 Q 380,280 500,305" stroke="#7a471b" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M 230,330 Q 370,345 530,320" stroke="#7a471b" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>

      <!-- Plump Rolled Oats on Top -->
      <ellipse cx="280" cy="285" rx="18" ry="8" fill="url(#oatGrad)" transform="rotate(-20 280 285)"/>
      <ellipse cx="360" cy="295" rx="20" ry="9" fill="url(#oatGrad)" transform="rotate(10 360 295)"/>
      <ellipse cx="440" cy="285" rx="17" ry="8" fill="url(#oatGrad)" transform="rotate(-15 440 285)"/>
      <ellipse cx="510" cy="310" rx="16" ry="7" fill="url(#oatGrad)" transform="rotate(25 510 310)"/>
      <ellipse cx="310" cy="340" rx="19" ry="8" fill="url(#oatGrad)" transform="rotate(5 310 340)"/>
      <ellipse cx="420" cy="345" rx="18" ry="8" fill="url(#oatGrad)" transform="rotate(-30 420 345)"/>
      <ellipse cx="480" cy="340" rx="15" ry="7" fill="url(#oatGrad)" transform="rotate(12 480 340)"/>

      <!-- Plump Juicy Raisins & Bright Cranberries on Top -->
      <!-- Cranberry 1 -->
      <ellipse cx="410" cy="275" rx="18" ry="12" fill="url(#cranberryGrad)" transform="rotate(-10 410 275)"/>
      <!-- Raisin 2 -->
      <ellipse cx="490" cy="295" rx="20" ry="14" fill="url(#raisinGrad)" transform="rotate(15 490 295)"/>
      <!-- Cranberry 3 -->
      <ellipse cx="330" cy="315" rx="22" ry="14" fill="url(#cranberryGrad)" transform="rotate(-5 330 315)"/>
      <!-- Raisin 4 -->
      <ellipse cx="250" cy="310" rx="17" ry="11" fill="url(#raisinGrad)" transform="rotate(20 250 310)"/>
      <!-- Raisin 5 -->
      <ellipse cx="450" cy="330" rx="19" ry="13" fill="url(#raisinGrad)" transform="rotate(-12 450 330)"/>
    </g>

  </g>

  <!-- Loose Raisins & Oats on the White Plate Ground (Matching user photo) -->
  <g>
    <!-- Single Raisin bottom right -->
    <ellipse cx="680" cy="830" rx="18" ry="12" fill="url(#raisinGrad)" transform="rotate(25 680 830)" filter="url(#layerShadow)"/>
    <!-- Loose Cranberry bottom left -->
    <ellipse cx="140" cy="790" rx="16" ry="11" fill="url(#cranberryGrad)" transform="rotate(-15 140 790)" filter="url(#layerShadow)"/>
    <!-- Loose Oat Flakes on ground -->
    <ellipse cx="180" cy="820" rx="12" ry="5" fill="url(#oatGrad)" transform="rotate(35 180 820)"/>
    <ellipse cx="630" cy="800" rx="14" ry="6" fill="url(#oatGrad)" transform="rotate(-20 630 800)"/>
    <ellipse cx="650" cy="840" rx="10" ry="4" fill="url(#oatGrad)"/>
  </g>
</svg>
